# dsh-model-health-probe bundle patch: inserts the plugin row into the profile
# roster. The row is a bare plugin by package name: the node half (exports ".")
# runs in the host process (settings read + three-protocol bare-HTTP probe +
# HTTP endpoints + in-memory record ring), and the `dsh.client` declaration in
# package.json makes the browser half (exports "./client", served at
# /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: model-health-probe
      name: dsh-model-health-probe
